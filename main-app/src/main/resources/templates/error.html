<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CineSpectrum | Error</title>

    <link rel="stylesheet" href="/css/styles.css"/>
    <link rel="stylesheet" href="/css/home.css"/>

    <style>
        .error-page {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 100px;
        }

        .error-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 25px rgba(0,0,0,0.25);
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .error-title {
            color: var(--text);
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .error-message {
            color: var(--muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .error-code {
            color: #3ad5ff;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }


    </style>
</head>

<body style="display:flex; flex-direction:column; min-height:100vh; overflow-x:hidden;">

<header class="site-header user-header"
        style="position:fixed; top:0; left:0; right:0; z-index:1000;">
    <div class="container header-inner">

        <div th:replace="~{fragments/logo :: logo-brand}"></div>

    </div>
</header>


<main class="error-page">

    <div class="error-card">

        <div class="error-icon">
            ⚠️
        </div>

        <h1 class="error-title">
            Oops! Something went wrong.
        </h1>

        <p class="error-message">
            We're sorry, but an unexpected error occurred.
            Please try again later or return to the home page.
        </p>

        <p class="error-code"
           th:if="${errorStatusCode}">
            Error code:
            <span th:text="${errorStatusCode}"></span>
        </p>



    </div>

</main>


<div th:replace="~{fragments/footer :: app-footer-minimal}"></div>


</body>
</html>
