<div th:fragment="notification-bell" class="notification-dropdown" style="position: relative; display: inline-block;">

    <a th:href="@{/notifications}" id="notificationBell" style="color: inherit; text-decoration: none; font-size: 1.2rem; position: relative;">
        <i class="fas fa-bell"></i>
        <span th:if="${unreadCount != null and unreadCount > 0}" class="badge-counter" th:text="${unreadCount}"
              style="position: absolute; top: -5px; right: -8px; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px;">
        </span>
    </a>

</div>
